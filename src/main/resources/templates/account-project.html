<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head}">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        /* Glass card */
        .glass-card {
            width: 420px;
            padding: 30px;
            border-radius: 15px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            text-align: center;
            color: white;
        }

        /* Avatar */
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid rgba(255,255,255,0.4);
        }

        /* Username */
        .username {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Info rows */
        .info {
            text-align: left;
            margin-top: 15px;
        }

        .info div {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .label {
            color: #ddd;
        }

        .value {
            font-weight: bold;
        }

        /* Button */
        .btn {
            margin-top: 20px;
            padding: 10px 25px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="glass-card"
    th:each =>

    <img class="profile-img"
         th:src="@{'/uploads/' + ${user.image}}"
         alt="profileImage">

    <div class="username" th:text="${user.username}"></div>

    <div class="info">
        <div>
            <span class="label">Email</span>
            <span class="value" th:text="${user.email}"></span>
        </div>

        <div>
            <span class="label">First name</span>
            <span class="value" th:text="${user.firstName}"></span>
        </div>

        <div>
            <span class="label">Middle name</span>
            <span class="value" th:text="${user.middleName}"></span>
        </div>

        <div>
            <span class="label">Last name</span>
            <span class="value" th:text="${user.lastName}"></span>
        </div>
    </div>

    <a th:href="@{/profile/edit}">
        <button class="btn">Edit Profile</button>
    </a>

</div>

</body>
</html>
