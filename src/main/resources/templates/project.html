<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head}">
</head>
<body>
<div th:replace="~{fragments/nav}"></div>
<article id="portfolio" class="wrapper style3">
  <div class="container">
    <header>
      <h2>Projects</h2>
      <p>Here you have to find my projects</p>
    </header>
    <div class="row"
         th:each ="current : ${projects}">
      <div class="col-4 col-6-medium col-12-small">
        <article class="box style2">
          <a th:href="${current.projectGitHubLink}" class="image featured">
            <img th:src="@{/images/pic01.jpg}" alt="" /></a>
          <h3 th:text="current.projectName">
            <a th:href="${current.projectGitHubLink}"></a></h3>
          <p th:text="${current.projectDescription}"></p>
        </article>
      </div>
    </div>
    <footer>
      <p>You have new project?</p>
      <a th:href="@{/{userId}/myprojects/new(userId=${userId})}" class="button large scrolly">Add it here!</a>
    </footer>
  </div>
</article>

<!-- Scripts -->
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/jquery.scrolly.min.js}"></script>
<script th:src="@{/js/browser.min.js}"></script>
<script th:src="@{/js/breakpoints.min.js}"></script>
<script th:src="@{/js/util.js}"></script>
<script th:src="@{/js/main.js}"></script>

</body>
</html>
