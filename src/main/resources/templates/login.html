<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head}">
</head>
<body>
<div th:replace="~{fragments/nav}"></div>
<article id="contact" class="wrapper style4">
  <div class="container medium">
    <header>
      <h2>LOGIN</h2>
    </header>
    <div class="row">
      <div class="col-12">
        <form   th:method="post"
                th:action="@{/login}"
                th:object = "${userLoginDTO}">
          <div class="row">
            <div class="col-12">
              <input th:field="*{username}"
                     type="text"
                     name="username"
                     id="username"
                     placeholder="Username"
                     th:errorclass="is-invalid"/>
              <p class="invalid-feedback errors alert alert-danger"
                 th:errors="*{username}">
              </p>
            </div>
            <div class="col-12">
              <input
                      type="password"
                      name="password"
                      th:field="*{password}"
                      id="password"
                      placeholder="Password"
                      th:errorclass="is-invalid"/>
              <div th:if="${param.banned}" style="color:red;">
                Your account is banned!
              </div>

              <div th:if="${param.error}" style="color:red;">
                Invalid username or password!
              </div>
            <div class="col-12">
              <ul class="actions">
                <li><input type="submit" value="Login" /></li>
              </ul>
            </div>
          </div>
          </div>
        </form>
      </div>
      <div th:replace="~{fragments/social}"></div>
      </div>
    </div>
    <footer>
      <ul id="copyright">
        <li>&copy; Untitled. All rights reserved.</li><li>Design: <a href="http://html5up.net">HTML5 UP</a></li>
      </ul>
    </footer>
  </div>
</article>

<!-- Scripts -->
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/jquery.scrolly.min.js}"></script>
<script th:src="@{/js/browser.min.js}"></script>
<script th:src="@{/js/breakpoints.min.js}"></script>
<script th:src="@{/js/util.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
